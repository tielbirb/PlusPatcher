name: Build PlusPatcher
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Generate signing key (signs the patched APKs)
        run: |
          [ -f app/src/main/assets/pp.p12 ] || keytool -genkeypair -keystore app/src/main/assets/pp.p12 -storetype PKCS12 \
            -storepass plusplus -keypass plusplus -alias pp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PlusPatcher"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: PlusPatcher-apk, path: app/build/outputs/apk/debug/*.apk }
      - name: Zip project source
        run: zip -r PlusPatcher-source.zip . -x ".git/*" "app/build/*" ".gradle/*" "build/*"
      - uses: actions/upload-artifact@v4
        with: { name: PlusPatcher-source, path: PlusPatcher-source.zip }
