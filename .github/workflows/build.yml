name: Build PlusPatcher
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.7' }
      - name: Accept Android SDK licenses and install platform
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - name: Generate signing key (signs the patched APKs)
        run: |
          [ -f app/src/main/assets/pp.p12 ] || keytool -genkeypair -keystore app/src/main/assets/pp.p12 -storetype PKCS12 \
            -storepass plusplus -keypass plusplus -alias pp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PlusPatcher"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v6
        with: { name: PlusPatcher-apk, path: app/build/outputs/apk/debug/*.apk }
      - name: Zip project source
        run: zip -r PlusPatcher-source.zip . -x ".git/*" "app/build/*" ".gradle/*" "build/*"
      - uses: actions/upload-artifact@v6
        with: { name: PlusPatcher-source, path: PlusPatcher-source.zip }
